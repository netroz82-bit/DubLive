<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b"><title>DubLive</title>
<style>
:root{--o:#ff7a00;--o2:#ffb040;--bg:#0b0b0b;--c:#171717;--l:#2b2b2b;--tx:#f3f3f3;--mu:#9a9a9a;--er:#ff7b6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif}
[hidden]{display:none!important}
#app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:800;direction:ltr}
.brand img{width:36px;height:36px;border-radius:9px}.brand span{color:var(--o)}
#gear{background:var(--c);border:1px solid var(--l);color:var(--o);width:40px;height:40px;border-radius:12px;font-size:1.3rem;cursor:pointer}
#home{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto 1fr}
#low{display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
#feed{min-height:0;overflow:auto;padding:2px 0}
#feed:empty::before{content:"متن را بنویسید یا دکمه نارنجی را نگه دارید و صحبت کنید.";display:block;color:var(--mu);text-align:center;margin-top:30px;font-size:.9rem}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}
.card.err{border-color:var(--er)}
.o{color:var(--mu);font-size:.85rem;white-space:pre-wrap}
.t{font-size:1.1rem;color:var(--o2);margin-top:6px;white-space:pre-wrap}
.m{font-size:.8rem;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.m:empty{display:none}
.err .m{color:var(--er)}
.sm{background:none;border:1px solid var(--o);color:var(--o);border-radius:20px;padding:4px 12px;font:inherit;cursor:pointer}
.sp{width:14px;height:14px;border:2px solid var(--l);border-top-color:var(--o);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#stage{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
#stage label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--mu)}
select,input{background:var(--c);color:var(--tx);border:1px solid var(--l);border-radius:12px;padding:11px 8px;font:inherit;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--o);outline-offset:1px}
#mic{width:clamp(150px,46vw,190px);height:clamp(150px,46vw,190px);flex:none;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--o2),var(--o) 60%,#c24d00);box-shadow:0 0 0 6px #ff7a0022,0 8px 30px #ff7a0055;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .15s}
#mic svg{width:42%;height:42%;fill:#0b0b0b;pointer-events:none}
#mic.rec{transform:scale(1.1);animation:p 1.1s infinite}
@keyframes p{from{box-shadow:0 0 0 0 #ff7a0099}to{box-shadow:0 0 0 36px #ff7a0000}}
#status{min-height:1.5em;text-align:center;font-size:.85rem;color:var(--mu);padding:8px 0 4px}#status.e{color:var(--er)}
.bar{display:flex;gap:10px;padding:4px 0 28px}
.bar input{padding:17px 14px;font-size:1.1rem}
#tr,#ok{background:var(--o);color:#0b0b0b;font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 26px;cursor:pointer}#tr{font-size:1.05rem}
#settings{padding-top:10px;flex:1;overflow:auto}#settings h2{margin:0 0 16px;color:var(--o)}
#settings label{display:block;margin:14px 0 8px}.hint{color:var(--mu);font-size:.82rem;line-height:1.8}.hint a{color:var(--o2)}
#ok{width:100%;padding:13px;margin:10px 0 16px}
.st{font-size:.82rem;color:var(--mu);margin:8px 0 2px}.st::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-inline-end:7px}
.st.g::before{background:#3ddc84}.st.e::before{background:var(--er)}.st.w::before{background:var(--o)}
.card{position:relative}.x{position:absolute;top:6px;left:6px;background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer;padding:6px 10px}.o{padding-inline-end:34px}
</style></head><body>
<div id="app">
<header><div class="brand"><img id="logo" alt=""><div>Dub<span>Live</span></div></div><button id="gear" aria-label="تنظیمات">&#9881;</button></header>
<section id="home">
 <main id="feed"></main>
 <div id="stage">
  <label>زبان ورودی<select id="src"></select></label>
  <button id="mic" aria-label="نگه دارید و صحبت کنید"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>
  <label>زبان خروجی<select id="dst"></select></label>
 </div>
 <div id="low"><div id="status"></div><div class="bar"><input id="txt" dir="auto" placeholder="متن برای ترجمه به انگلیسی…" autocomplete="off"><button id="tr">ترجمه</button></div></div>
</section>
<section id="settings" hidden>
 <h2>تنظیمات</h2>
 <label for="prov">سرویس ترجمه</label>
 <select id="prov"><option value="groq">Groq (پیشنهادی)</option><option value="gemini">Gemini</option></select>
 <label for="gkey">کلید API گروک (Groq)</label>
 <input id="gkey" type="password" dir="ltr" placeholder="gsk_…" autocomplete="off">
 <div class="st" id="st-groq"></div>
 <p class="hint">کلید رایگان: <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a></p>
 <label for="key">کلید API جمینای</label>
 <input id="key" type="password" dir="ltr" placeholder="AIza…" autocomplete="off">
 <div class="st" id="st-gemini"></div>
 <p class="hint">کلید جمینای: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></p>
 <p class="hint">کلیدها فقط روی همین دستگاه ذخیره می‌شوند. وضعیت سرورها به‌صورت زنده بررسی می‌شود.</p>
 <button id="ok">تایید</button>
</section>
</div>
<audio id="player" playsinline></audio>

 for(let i=0;i<models.length;i++){const m=ok[models[0]]||models[i],r=await req(API+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)},j);
  if(r.status==404&&i<models.length-1&&!ok[models[0]])continue;
  if(!r.ok){let m2="";try{m2=(await r.json()).error.message}catch{}const s=r.status,bad=s==400&&/API key/i.test(m2),x=E(
   bad?"کلید API نامعتبر است؛ آن را در تنظیمات اصلاح کنید.":s==400?"درخواست نامعتبر بود: "+m2:
   s==401||s==403?"کلید API اجازه دسترسی ندارد یا سرویس در منطقه شما محدود است.":s==404?"مدل مورد نظر در دسترس نیست.":
   s==429?"سهمیه یا محدودیت تعداد درخواست پر شده؛ کمی بعد دوباره تلاش کنید.":s>=500?"سرور جمینای شلوغ است ("+s+"). دوباره تلاش کنید.":"خطای API ("+s+"): "+m2);
   x.key=bad||s==401||s==403;throw x}
  ok[models[0]]=m;return r.json()}}
const txt=d=>{const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");if(!t.trim())throw E(d.promptFeedback?.blockReason?"درخواست توسط فیلتر ایمنی مسدود شد.":"API پاسخ خالی داد؛ دوباره تلاش کنید.");return t};
async function speak(t,j){const d=await gem(TTS,{contents:[{parts:[{text:t}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:VOICE}}}}},j),
 p=(d.candidates?.[0]?.content?.parts||[]).find(p=>p.inlineData);if(!p)throw E("API صدایی برنگرداند؛ دوباره تلاش کنید.");
 const bin=atob(p.inlineData.data),n=bin.length>>1,a=new Int16Array(n),rate=+((/rate=(\d+)/.exec(p.inlineData.mimeType||"")||[])[1]||24000);
 for(let i=0;i<n;i++)a[i]=(bin.charCodeAt(2*i)|bin.charCodeAt(2*i+1)<<8)<<16>>16;return wavBlob(a,rate)}
/* Groq */
async function gcall(path,body,j,json){const r=await req(GAPI+path,{method:"POST",headers:{Authorization:"Bearer "+gkey,...(json?{"Content-Type":"application/json"}:{})},body},j);
 if(!r.ok){let m="",c="";try{const e=(await r.json()).error;m=e.message||"";c=e.code||""}catch{}const s=r.status,x=E(
  s==401?"کلید Groq نامعتبر است؛ آن را در تنظیمات اصلاح کنید.":s==403?"دسترسی Groq برای این کلید یا منطقه مجاز نیست.":
  s==429?"سقف رایگان Groq پر شده؛ کمی بعد دوباره تلاش کنید.":s>=500?"سرور Groq شلوغ است ("+s+"). دوباره تلاش کنید.":"خطای Groq ("+s+"): "+m);
  x.key=s==401||s==403;x.model=!!json&&(s==404||/decommission|not.?found/i.test(m+c));throw x}
 return r.json()}
async function gSTT(wav,lang,j){const f=new FormData();f.append("file",new File([wav],"a.wav",{type:"audio/wav"}));f.append("model","whisper-large-v3-turbo");f.append("response_format","json");f.append("temperature","0");if(CODE[lang])f.append("language",CODE[lang]);return(await gcall("audio/transcriptions",f,j)).text||""}
async function gChat(dst,text,j){let last;for(const m of GM){try{
 const d=await gcall("chat/completions",JSON.stringify({model:m,temperature:0,messages:[{role:"system",content:`You are a translation engine. Translate the user's message into ${dst}. Output only the translation, nothing else.`},{role:"user",content:text}]}),j,1),t=d.choices?.[0]?.message?.content?.trim();
 if(!t)throw E("پاسخ خالی بود؛ دوباره تلاش کنید.");return t}catch(e){if(!e.model)throw e;last=e}}throw last}
/* playback: Gemini returns audio; with Groq the translation is read by the device voice */
function playJob(j){cur=j;if(j.audio!=="local")return play(j.audio);const ss=window.speechSynthesis;if(!ss)return say("این مرورگر پخش صدا ندارد.",1);
 ss.cancel();const l=CODE[j.dst]||"en",v=ss.getVoices();if(v.length&&!v.some(x=>x.lang.toLowerCase().startsWith(l)))return say("صدای این زبان روی دستگاه نصب نیست؛ فقط متن نمایش داده شد.",1);
 const u=new SpeechSynthesisUtterance(j.tr);u.lang=l;ss.speak(u)}

/* jobs: each card keeps its recording and finished steps, so retry resumes where it failed */
function newJob(j){j.ac=new AbortController();j.c=document.createElement("div");
 j.c.innerHTML='<button class="x" aria-label="حذف">✕</button><div class="o" dir="auto"></div><div class="t" dir="auto"></div><div class="m"></div>';
 j.c.querySelector(".o").textContent=j.kind=="v"?"🎤 "+j.sn+" ← "+j.dn:j.orig;
 j.c.querySelector(".x").onclick=()=>{j.dead=1;j.ac.abort();if(cur===j){player.pause();try{speechSynthesis.cancel()}catch{}}j.c.remove()};
 $("#feed").append(j.c);j.c.scrollIntoView({behavior:"smooth",block:"end"});run(j)}
async function run(j){
 const c=j.c,m=c.querySelector(".m"),step=t=>m.innerHTML='<i class="sp"></i>'+t,g=prov=="groq";c.className="card";
 try{
  if(!j.tr){
   if(j.kind=="v"){
    step("آماده‌سازی صدا…");if(!j.wav){try{j.wav=await toWav(j.blob)}catch{throw E("پردازش صدای ضبط‌شده ممکن نشد؛ دوباره ضبط کنید.")}}
    if(g){
     if(!j.orig){step("در حال تشخیص گفتار…");j.orig=(await gSTT(j.wav,j.src,j)).trim();if(!j.orig)throw E(NS)}
     step("در حال ترجمه…");j.tr=await gChat(j.dst,j.orig,j);
    }else{
     step("در حال تشخیص و ترجمه…");
     const d=await gem(TXT,{contents:[{parts:[{text:`The audio is spoken in ${j.src}. Transcribe it, then translate it into ${j.dst}. Reply only as JSON: {"original":"...","translation":"..."}. If there is no intelligible speech, use empty strings.`},{inline_data:{mime_type:"audio/wav",data:await b64(j.wav)}}]}],generationConfig:{responseMimeType:"application/json"}},j);
     let r;try{r=JSON.parse(txt(d).replace(/```json|```/g,""))}catch(e){if(e.key!==undefined||/API/.test(e.message))throw e;throw E("پاسخ API قابل خواندن نبود؛ دوباره تلاش کنید.")}
     if(!String(r.translation||"").trim())throw E(NS);
     j.orig=r.original||"";j.tr=String(r.translation).trim();
    }
   }else{step("در حال ترجمه…");j.tr=g?await gChat("English",j.orig,j):txt(await gem(TXT,{systemInstruction:{parts:[{text:"Translate the user's text into English. Output only the translation."}]},contents:[{parts:[{text:j.orig}]}]},j)).trim()}
  }
  if(j.dead)return;
  c.querySelector(".o").textContent=j.orig;c.querySelector(".t").textContent=j.tr;
  if(j.kind=="v"&&!j.audio){if(g)j.audio="local";else{step("در حال تولید صدا…");j.audio=await speak(j.tr,j)}}
  if(j.dead)return;m.innerHTML="";
  if(j.audio){const b=document.createElement("button");b.className="sm";b.textContent="🔊 پخش";b.onclick=()=>playJob(j);m.append(b);playJob(j)}
 }catch(e){
  if(j.dead)return;
  c.className="card err";m.textContent=e.message||"خطای ناشناخته";
  const b=document.createElement("button");b.className="sm";b.textContent="تلاش مجدد";b.onclick=()=>run(j);m.append(b);
  if(e.key){const s=document.createElement("button");s.className="sm";s.textContent="تنظیمات";s.onclick=()=>go("settings");m.append(s)}
 }}

/* text translate */
function submit(){const v=$("#txt").value.trim();if(!v)return;if(!KEY()){say("ابتدا کلید API را ثبت کنید.",1);return go("settings")}$("#txt").value="";say();newJob({kind:"t",orig:v})}
$("#tr").onclick=submit;$("#txt").onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();submit()}};

/* hold-to-record */
const mic=$("#mic"),sel=id=>$("#"+id).options[$("#"+id).selectedIndex];
mic.oncontextmenu=e=>e.preventDefault();
mic.onpointerdown=e=>{e.preventDefault();if(rec||starting)return;holding=true;try{mic.setPointerCapture(e.pointerId)}catch{}unlock();start()};
mic.onpointerup=mic.onpointercancel=()=>{holding=false;if(rec&&rec.state=="recording")rec.stop()};
async function start(){
 if(!KEY()){holding=false;say("ابتدا کلید API را ثبت کنید.",1);return go("settings")}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return say("این مرورگر یا این نوع باز کردن صفحه از ضبط صدا پشتیبانی نمی‌کند.",1);
 starting=true;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){starting=false;holding=false;return say(e.name=="NotAllowedError"?"دسترسی به میکروفون داده نشد؛ اجازه را در تنظیمات مرورگر فعال کنید.":e.name=="NotFoundError"?"میکروفونی پیدا نشد.":"خطا در میکروفون: "+e.message,1)}
 starting=false;if(!holding){stream.getTracks().forEach(t=>t.stop());return}
 const ch=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:rec.mimeType});rec=null;mic.classList.remove("rec");
  if(Date.now()-t0<600||!b.size)return say("ضبط خیلی کوتاه بود؛ دکمه را نگه دارید و صحبت کنید.",1);
  say();newJob({kind:"v",blob:b,src:$("#src").value,dst:$("#dst").value,sn:sel("src").text,dn:sel("dst").text})};
 rec.start();t0=Date.now();mic.classList.add("rec");say("در حال ضبط… برای ترجمه رها کنید.")}
</script></body></html>
